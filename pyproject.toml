[project]
name = "wirio-settings"
dynamic = ["version"]
description = "Lightning-fast, strongly typed, and zero-boilerplate settings library for Python"
authors = [{ name = "Andreu Codina" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
]
keywords = [
    "settings",
    "azure",
    "Azure Key Vault",
    "aws",
    "AWS Secrets Manager",
    "gcp",
    "GCP Secret Manager",
    "kubernetes",
    "Kubernetes CSI",
]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.4"]

[project.urls]
Homepage = "https://github.com/wirio-org/wirio-settings"
Repository = "https://github.com/wirio-org/wirio-settings"
Documentation = "https://wirio-org.github.io/wirio-settings"
Changelog = "https://github.com/wirio-org/wirio/releases-settings"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "maturin>=1.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.uv]
exclude-newer = "1 week"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "uv.lock" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "**/*.rs" },
]

[tool.maturin]
python-source = "python"
module-name = "wirio_settings._wirio_settings"

[tool.maturin.generate-ci.github]
trusted-publishing = true

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
extend-exclude = ["python/wirio_settings/_wirio_settings.pyi"]

[tool.pytest]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
